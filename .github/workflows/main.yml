name: kicad-exports@v2.3.2

on:
  push:
    paths:
    - '**.sch'
    - '**.kicad_pcb'
    - '.github/workflows/main.yml'
  pull_request:
    paths:
      - '**.sch'
      - '**.kicad_pcb'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: manojsahukar/kicad-exports@fe47c19ec3cda35c4c62d4fc4f1e50a63838e5d5 # v2.3.2
      with:
      # Required - kibot config file
        config: docs.kibot.yaml
      # optional - prefix to output defined in config
        dir: docs
      # optional - schematic file
        schema: 'KiCAD_proj/devops-demo/devops-demo.sch'
      # optional - PCB design file
        board: 'KiCAD_proj/devops-demo/devops-demo.kicad_pcb'
      # optional - verbose output info
        verbose: 1
    - name: upload results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: docs
        path: docs
